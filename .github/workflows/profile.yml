name: Profile chart

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-chart
  cancel-in-progress: false

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Draw the chart
        run: python scripts/profile_chart.py
        env:
          PROFILE_LOGIN: ${{ github.repository_owner }}
          # The repository's own token sees what the public profile shows, so private work stays anonymous daily counts.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: a read-only token of the profile's owner, for the private-work totals. Without it the last card stays.
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}

      - name: Commit the chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          git diff --cached --quiet || git commit -m "Update the contribution chart $(date -u +%F)"
          git push
