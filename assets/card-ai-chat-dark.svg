<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 434 230" width="434" height="230" role="img" aria-label="An AI chat: a question, an answer streaming in, and a small live chart drawn at the end of the answer.">
<style>
@media (prefers-reduced-motion: no-preference) {
  .ask { animation: ask 8s ease-out infinite; }
  .reply { animation: reply 8s ease-out infinite; }
  .stream { animation: stream 8s steps(24) infinite; }
  .spark { stroke-dasharray: 220; animation: spark 8s ease-out infinite; }
  .dots { animation: dots 8s steps(1) infinite; }
  @keyframes ask { 0%,4% { opacity: 0; transform: translateY(6px); } 10%,94% { opacity: 1; transform: none; } 100% { opacity: 0; } }
  @keyframes dots { 0%,12% { opacity: 0; } 14%,24% { opacity: 1; } 26%,100% { opacity: 0; } }
  @keyframes reply { 0%,24% { opacity: 0; } 28%,94% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes stream { 0%,28% { width: 0; } 56%,94% { width: 300px; } 100% { width: 0; } }
  @keyframes spark { 0%,56% { stroke-dashoffset: 220; } 72%,94% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 220; } }
}
</style>
<rect width="434" height="230" rx="10" fill="#0d1117"/>
<text x="20" y="28" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" letter-spacing="1.5" fill="#8b949e">AI CHAT</text>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif">
  <g class="ask"><rect x="194" y="42" width="220" height="32" rx="14" fill="#4493f8"/><text x="304" y="63" font-size="12" text-anchor="middle" fill="#ffffff">How did signups do this month?</text></g>
  <g class="dots" opacity="0"><circle cx="36" cy="100" r="3.5" fill="#8b949e"/><circle cx="48" cy="100" r="3.5" fill="#8b949e"/><circle cx="60" cy="100" r="3.5" fill="#8b949e"/></g>
  <g class="reply" opacity="0">
    <rect x="20" y="86" width="330" height="124" rx="14" fill="#161b22" stroke="#30363d"/>
    <clipPath id="streaming"><rect class="stream" x="34" y="94" width="0" height="40"/></clipPath>
    <g clip-path="url(#streaming)">
      <text x="34" y="110" font-size="12" fill="#e6edf3">Up 18% on last month, mostly from the</text>
      <text x="34" y="128" font-size="12" fill="#e6edf3">new onboarding flow. Here is the trend:</text>
    </g>
    <rect x="34" y="140" width="300" height="56" rx="8" fill="#0d1117" stroke="#30363d"/>
    <path class="spark" d="M44 186 L84 178 L124 182 L164 168 L204 170 L244 156 L284 150 L324 146" fill="none" stroke="#3fb950" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</g>
</svg>