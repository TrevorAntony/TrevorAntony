<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 434 230" width="434" height="230" role="img" aria-label="A workflow run moving through Check, Resolve, Read and Summarise to Done, each step lighting up in turn and ending with a tick.">
<style>
@media (prefers-reduced-motion: no-preference) {
  .s0 { animation: s0 8s ease-in-out infinite; }
  @keyframes s0 { 0%,8% { fill: #161b22; stroke: #30363d; } 12%,92% { fill: #4493f8; stroke: transparent; } 100% { fill: #161b22; stroke: #30363d; } }
  .s1 { animation: s1 8s ease-in-out infinite; }
  @keyframes s1 { 0%,22% { fill: #161b22; stroke: #30363d; } 26%,92% { fill: #4493f8; stroke: transparent; } 100% { fill: #161b22; stroke: #30363d; } }
  .s2 { animation: s2 8s ease-in-out infinite; }
  @keyframes s2 { 0%,36% { fill: #161b22; stroke: #30363d; } 40%,92% { fill: #4493f8; stroke: transparent; } 100% { fill: #161b22; stroke: #30363d; } }
  .s3 { animation: s3 8s ease-in-out infinite; }
  @keyframes s3 { 0%,50% { fill: #161b22; stroke: #30363d; } 54%,92% { fill: #4493f8; stroke: transparent; } 100% { fill: #161b22; stroke: #30363d; } }
  .s4 { animation: s4 8s ease-in-out infinite; }
  @keyframes s4 { 0%,64% { fill: #161b22; stroke: #30363d; } 68%,92% { fill: #3fb950; stroke: transparent; } 100% { fill: #161b22; stroke: #30363d; } }
  .flow { stroke-dasharray: 6 6; animation: flow 1s linear infinite; }
  .tick { animation: tick 8s ease-out infinite; }
  .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 8s ease-out infinite; }
  @keyframes flow { to { stroke-dashoffset: -12; } }
  @keyframes tick { 0%,68% { opacity: 0; } 74%,92% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes pulse { 0%,68% { opacity: 0; transform: scale(1); } 72% { opacity: 0.5; } 90%,100% { opacity: 0; transform: scale(1.9); } }
}
</style>
<rect width="434" height="230" rx="10" fill="#0d1117"/>
<text x="20" y="28" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" letter-spacing="1.5" fill="#8b949e">WORKFLOWS</text>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif">
  <line class="flow" x1="62" x2="112" y1="118" y2="118" stroke="#8b949e" stroke-width="2"/><line class="flow" x1="148" x2="198" y1="118" y2="118" stroke="#8b949e" stroke-width="2"/><line class="flow" x1="234" x2="284" y1="118" y2="118" stroke="#8b949e" stroke-width="2"/><line class="flow" x1="320" x2="370" y1="118" y2="118" stroke="#8b949e" stroke-width="2"/>
  <circle class="pulse" cx="388" cy="118" r="16" fill="#3fb950" opacity="0"/>
  <circle class="s0" cx="44" cy="118" r="16" fill="#161b22" stroke="#30363d" stroke-width="2"/><text x="44" y="156" font-size="11" text-anchor="middle" fill="#8b949e">Check</text><circle class="s1" cx="130" cy="118" r="16" fill="#161b22" stroke="#30363d" stroke-width="2"/><text x="130" y="156" font-size="11" text-anchor="middle" fill="#8b949e">Resolve</text><circle class="s2" cx="216" cy="118" r="16" fill="#161b22" stroke="#30363d" stroke-width="2"/><text x="216" y="156" font-size="11" text-anchor="middle" fill="#8b949e">Read</text><circle class="s3" cx="302" cy="118" r="16" fill="#161b22" stroke="#30363d" stroke-width="2"/><text x="302" y="156" font-size="11" text-anchor="middle" fill="#8b949e">Summarise</text><circle class="s4" cx="388" cy="118" r="16" fill="#161b22" stroke="#30363d" stroke-width="2"/><text x="388" y="156" font-size="11" text-anchor="middle" fill="#8b949e">Done</text>
  <path class="tick" d="M381 118 l5 5 l9 -10" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0"/>
  <text x="20" y="196" font-size="12" fill="#8b949e">Each run shows its state as it moves, and retries what fails.</text>
</g>
</svg>