<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300" role="img"
 aria-label="Trevor Antony, full-stack software engineer working on AI and UI/UX. A small interface switches theme and asks to approve a change.">
<style>
@media (prefers-reduced-motion: no-preference) {
  .cursor { animation: move 8s ease-in-out infinite; }
  .night { animation: night 8s ease-in-out infinite; }
  .knob { animation: knob 8s ease-in-out infinite; }
  .ask { animation: ask 8s ease-out infinite; }
  .tick { animation: tick 8s ease-out infinite; }
  .caret { animation: blink 1.1s steps(1) infinite; }
  .ink { animation: ink 8s ease-in-out infinite; }
}
@keyframes move { 0%,8% { transform: translate(0,0); } 22%,30% { transform: translate(296px,-104px); } 52%,60% { transform: translate(260px,-4px); } 78%,100% { transform: translate(0,0); } }
@keyframes night { 0%,24% { opacity: 0; } 30%,92% { opacity: 1; } 98%,100% { opacity: 0; } }
@keyframes knob { 0%,24% { transform: translateX(0); } 30%,92% { transform: translateX(14px); } 98%,100% { transform: translateX(0); } }
@keyframes ask { 0%,34% { opacity: 0; transform: translateY(6px); } 40%,92% { opacity: 1; transform: translateY(0); } 98%,100% { opacity: 0; } }
@keyframes tick { 0%,56% { opacity: 0; } 60%,92% { opacity: 1; } 98%,100% { opacity: 0; } }
@keyframes blink { 50% { opacity: 0; } }
@keyframes ink { 0%,24% { fill: #e6edf3; } 30%,92% { fill: #e6edf3; } 98%,100% { fill: #e6edf3; } }
</style>
<rect width="420" height="300" rx="10" fill="#0d1117"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif">
  <text x="20" y="48" font-size="30" font-weight="700" fill="#e6edf3">Trevor Antony<tspan class="caret" fill="#d29922">_</tspan></text>
  <text x="20" y="76" font-size="14" fill="#8b949e">Full-stack software engineer · AI · UI/UX</text>
  <text x="20" y="98" font-size="12" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">Nairobi · React · TypeScript · Python</text>
</g>
<g transform="translate(20,120)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif">
  <rect width="380" height="160" rx="10" fill="#e6edf3" opacity="0.05" stroke="#8b949e" stroke-opacity="0.35"/>
  <rect class="night" width="380" height="160" rx="10" fill="#010409" opacity="0"/>
  <circle cx="16" cy="16" r="4" fill="#f85149"/><circle cx="30" cy="16" r="4" fill="#d29922"/><circle cx="44" cy="16" r="4" fill="#3fb950"/>
  <rect x="328" y="9" width="34" height="14" rx="7" fill="#8b949e" opacity="0.5"/>
  <g class="knob"><circle class="ink" cx="336" cy="16" r="5" fill="#e6edf3"/></g>
  <rect x="16" y="38" width="209" height="8" rx="4" fill="#8b949e" opacity="0.45"/>
  <rect x="16" y="54" width="152" height="8" rx="4" fill="#8b949e" opacity="0.3"/>
  <g class="ask" opacity="0">
    <rect x="16" y="76" width="348" height="56" rx="8" fill="#d29922" opacity="0.12"/>
    <text class="ink" x="28" y="98" font-size="12" fill="#e6edf3">Assistant · Let the support bot use a new model?</text>
    <rect x="260" y="108" width="80" height="18" rx="9" fill="#3fb950"/>
    <text x="300" y="121" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Approve</text>
    <text class="tick" x="28" y="122" font-size="11" fill="#3fb950" opacity="0">✓ Allowed, version 4</text>
  </g>
  <g class="cursor"><path d="M40 120 l0 16 l4 -4 l3 7 l3 -1 l-3 -7 l6 0 z" fill="#e6edf3" stroke="#0d1117" stroke-width="1"/></g>
</g>
</svg>