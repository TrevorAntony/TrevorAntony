<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300" role="img" aria-label="Trevor Antony, full-stack software engineer working on AI and UI/UX. A small window loads a dashboard card and switches theme.">
<style>
@media (prefers-reduced-motion: no-preference) {
  .skeleton { animation: skeleton 8s ease-in-out infinite; }
  .content { animation: content 8s ease-in-out infinite; }
  .bar { transform-box: fill-box; transform-origin: bottom; animation: grow 8s ease-out infinite; }
  .night { animation: night 8s ease-in-out infinite; }
  .knob { animation: knob 8s ease-in-out infinite; }
  .ink { animation: ink 8s ease-in-out infinite; }
  .cursor { animation: cursor 8s ease-in-out infinite; }
  .caret { animation: blink 1.1s steps(1) infinite; }
  @keyframes skeleton { 0%,18% { opacity: 1; } 26%,100% { opacity: 0; } }
  @keyframes content { 0%,20% { opacity: 0; } 28%,100% { opacity: 1; } }
  @keyframes grow { 0%,24% { transform: scaleY(0.05); } 40%,100% { transform: scaleY(1); } }
  @keyframes cursor { 0%,40% { transform: translate(0,0); } 54%,64% { transform: translate(280px,-112px); } 86%,100% { transform: translate(0,0); } }
  @keyframes night { 0%,56% { opacity: 0; } 62%,92% { opacity: 1; } 98%,100% { opacity: 0; } }
  @keyframes knob { 0%,56% { transform: translateX(0); } 62%,92% { transform: translateX(14px); } 98%,100% { transform: translateX(0); } }
  @keyframes ink { 0%,56% { fill: #1f2328; } 62%,92% { fill: #e6edf3; } 98%,100% { fill: #1f2328; } }
  @keyframes blink { 50% { opacity: 0; } }
}
</style>
<rect width="420" height="300" rx="10" fill="#ffffff"/>
<text x="20" y="28" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" letter-spacing="1.5" fill="#59636e"></text>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif">
  <text x="20" y="56" font-size="30" font-weight="700" fill="#1f2328">Trevor Antony<tspan class="caret" fill="#9a6700">_</tspan></text>
  <text x="20" y="82" font-size="14" fill="#59636e">Full-stack software engineer · AI · UI/UX</text>
  <text x="20" y="104" font-size="12" fill="#59636e" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">Nairobi · React · TypeScript · Python</text>
</g>
<g transform="translate(20,120)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif">
  <rect width="380" height="160" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
  <rect class="night" width="380" height="160" rx="10" fill="#0d1117" opacity="0"/>
  <circle cx="16" cy="16" r="4" fill="#cf222e"/><circle cx="30" cy="16" r="4" fill="#9a6700"/><circle cx="44" cy="16" r="4" fill="#1a7f37"/>
  <rect x="328" y="9" width="34" height="14" rx="7" fill="#59636e" opacity="0.5"/>
  <g class="knob"><circle class="ink" cx="336" cy="16" r="5" fill="#1f2328"/></g>
  <g class="skeleton">
    <rect x="16" y="40" width="190" height="10" rx="5" fill="#59636e" opacity="0.3"/>
    <rect x="16" y="60" width="122" height="10" rx="5" fill="#59636e" opacity="0.2"/>
    <rect x="16" y="84" width="348" height="60" rx="8" fill="#59636e" opacity="0.12"/>
  </g>
  <g class="content" opacity="0">
    <text class="ink" x="16" y="48" font-size="12" fill="#1f2328">Requests this week</text>
    <text class="ink" x="16" y="72" font-size="22" font-weight="700" fill="#1f2328">1,284</text>
    <text x="84" y="72" font-size="12" fill="#1a7f37">+18%</text>
    <rect class="bar" style="animation-delay:0.00s" x="22" y="104" width="18" height="34" rx="3" fill="#0969da" opacity="0.55"/><rect class="bar" style="animation-delay:0.08s" x="52" y="86" width="18" height="52" rx="3" fill="#0969da" opacity="0.62"/><rect class="bar" style="animation-delay:0.16s" x="82" y="98" width="18" height="40" rx="3" fill="#0969da" opacity="0.69"/><rect class="bar" style="animation-delay:0.24s" x="112" y="70" width="18" height="68" rx="3" fill="#0969da" opacity="0.76"/><rect class="bar" style="animation-delay:0.32s" x="142" y="80" width="18" height="58" rx="3" fill="#0969da" opacity="0.83"/><rect class="bar" style="animation-delay:0.40s" x="172" y="58" width="18" height="80" rx="3" fill="#0969da" opacity="0.90"/>
  </g>
  <g class="cursor"><path d="M70 130 l0 16 l4 -4 l3 7 l3 -1 l-3 -7 l6 0 z" fill="#1f2328" stroke="#ffffff" stroke-width="1"/></g>
</g>
</svg>