<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="880" height="220" role="img"
 aria-label="Trevor Antony, full-stack software engineer working on AI and UI/UX. A small interface switches theme and asks to approve a change.">
<style>
@media (prefers-reduced-motion: no-preference) {
  .cursor { animation: move 8s ease-in-out infinite; }
  .night { animation: night 8s ease-in-out infinite; }
  .knob { animation: knob 8s ease-in-out infinite; }
  .ask { animation: ask 8s ease-out infinite; }
  .tick { animation: tick 8s ease-out infinite; }
  .caret { animation: blink 1.1s steps(1) infinite; }
  .ink { animation: ink 8s ease-in-out infinite; }
}
@keyframes move { 0%,8% { transform: translate(0,0); } 22%,30% { transform: translate(276px,-104px); } 52%,60% { transform: translate(240px,-4px); } 78%,100% { transform: translate(0,0); } }
@keyframes night { 0%,24% { opacity: 0; } 30%,92% { opacity: 1; } 98%,100% { opacity: 0; } }
@keyframes knob { 0%,24% { transform: translateX(0); } 30%,92% { transform: translateX(14px); } 98%,100% { transform: translateX(0); } }
@keyframes ask { 0%,34% { opacity: 0; transform: translateY(6px); } 40%,92% { opacity: 1; transform: translateY(0); } 98%,100% { opacity: 0; } }
@keyframes tick { 0%,56% { opacity: 0; } 60%,92% { opacity: 1; } 98%,100% { opacity: 0; } }
@keyframes blink { 50% { opacity: 0; } }
@keyframes ink { 0%,24% { fill: #1f2328; } 30%,92% { fill: #e6edf3; } 98%,100% { fill: #1f2328; } }
</style>
<rect width="880" height="220" rx="10" fill="#ffffff"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif">
  <text x="40" y="84" font-size="38" font-weight="700" fill="#1f2328">Trevor Antony<tspan class="caret" fill="#9a6700">_</tspan></text>
  <text x="40" y="118" font-size="16" fill="#59636e">Full-stack software engineer · AI · UI/UX</text>
  <text x="40" y="144" font-size="13" fill="#59636e" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">Nairobi · React · TypeScript · Python</text>
</g>
<g transform="translate(500,28)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif">
  <rect width="360" height="164" rx="10" fill="#1f2328" opacity="0.05" stroke="#59636e" stroke-opacity="0.35"/>
  <rect class="night" width="360" height="164" rx="10" fill="#010409" opacity="0"/>
  <circle cx="16" cy="16" r="4" fill="#cf222e"/><circle cx="30" cy="16" r="4" fill="#9a6700"/><circle cx="44" cy="16" r="4" fill="#1a7f37"/>
  <rect x="308" y="9" width="34" height="14" rx="7" fill="#59636e" opacity="0.5"/>
  <g class="knob"><circle class="ink" cx="316" cy="16" r="5" fill="#1f2328"/></g>
  <rect x="16" y="38" width="198" height="8" rx="4" fill="#59636e" opacity="0.45"/>
  <rect x="16" y="54" width="144" height="8" rx="4" fill="#59636e" opacity="0.3"/>
  <g class="ask" opacity="0">
    <rect x="16" y="76" width="328" height="56" rx="8" fill="#9a6700" opacity="0.12"/>
    <text class="ink" x="28" y="98" font-size="12" fill="#1f2328">Assistant · Let the support bot use a new model?</text>
    <rect x="240" y="108" width="80" height="18" rx="9" fill="#1a7f37"/>
    <text x="280" y="121" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Approve</text>
    <text class="tick" x="28" y="122" font-size="11" fill="#3fb950" opacity="0">✓ Allowed, version 4</text>
  </g>
  <g class="cursor"><path d="M40 120 l0 16 l4 -4 l3 7 l3 -1 l-3 -7 l6 0 z" fill="#1f2328" stroke="#ffffff" stroke-width="1"/></g>
</g>
</svg>